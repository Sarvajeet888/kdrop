name: Native app preview builds
on:
  push:
    branches: [main]
    paths: ['native/**', 'desktop/**', 'android-native/**', '.github/workflows/apps.yml']
  pull_request:
    paths: ['native/**', 'desktop/**', 'android-native/**', '.github/workflows/apps.yml']
permissions:
  contents: read
concurrency:
  group: native-apps-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --no-save --package-lock=false jsdom
      - run: node tests/desktop-ui.js
      - run: node tests/run.js speed delivery-engine
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test native protocol
        run: cargo test --manifest-path native/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Windows preview
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: kdrop-windows-preview
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android preview
        working-directory: android-native
        run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kdrop-android-preview
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
