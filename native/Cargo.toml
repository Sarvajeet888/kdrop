[package]
name = "kdrop-native"
version = "0.1.0"
edition = "2021"
description = "KDrop local encrypted transfer prototype"
license = "MIT"

[dependencies]
base64 = "0.22"
rand = "0.8"
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
